name: CI, Release & Pages

# The only workflow of this repository, one run per push:
#
#   every push, every PR   test -> build-matrix
#   push to main           ... and then: pages-build -> pages-deploy   (GitHub Pages)
#   push of a tag          ... and then: release                       (GitHub Release)
#
# Nothing is published when tests fail.
#
# One time setup for Pages in the repository:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Result: https://stopsopa.github.io/xx/

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
  pull_request:
  # manual run from Actions tab (on main it republishes Pages)
  workflow_dispatch:

# nothing by default, every job asks for what it needs
permissions:
  contents: read

jobs:
  test:
    name: Test on Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      # xx binary runs node to load the config, xx.ts needs node which strips types on its own (22.18+)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # xx.sh is tested in bash and in zsh
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Compile binary
        run: /bin/bash compile.sh

      # esbuild for transpile.sh, test.sh generates templates/xx.js xx.mjs xx.cjs with it
      - name: Install npm dependencies
        run: npm ci

      - name: Run unit and E2E tests
        run: /bin/bash test.sh

  build-matrix:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: xx-darwin-arm64
            use_cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: xx-linux-x64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: xx-linux-arm64
            use_cross: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if required)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # Version is embedded only when a tag is built, the same value lands in xx.sh (job release).
      # Everything else is "dev", like xx.sh in the repository.
      - name: Build binary
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            export XX_VERSION="${{ github.ref_name }}"
          fi
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            # XX_VERSION reaches the container thanks to Cross.toml
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
          mkdir -p dist
          cp target/${{ matrix.target }}/release/xx dist/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Publish Release
    needs: build-matrix
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # needed for xx.sh (release asset), changelog.md and bash/release_notes.sh
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release files and checksums
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -exec cp {} release-dist/ \;
          # The binary alone is not usable, the wrapper is part of every release.
          # Version and md5 of all binaries of this release are embedded in it:
          # xx.sh refuses to work with any other binary.
          /bin/bash bash/embed.sh "${{ github.ref_name }}" release-dist/xx.sh release-dist/xx-*
          cd release-dist
          shasum -a 256 xx-* xx.sh > SHA256SUMS.txt
          cd ..
          /bin/bash bash/release_notes.sh "${{ github.ref_name }}" "${{ github.repository }}" release-dist > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          body_path: release_notes.md
          files: |
            release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub Pages: root directory of the repository, without directories with dependencies and
  # build results. The only build step: transpile.sh generates templates/xx.js xx.mjs xx.cjs
  # from templates/xx.ts, they exist only on Pages, "xx --init" downloads them from there (init.json).
  #
  # Two jobs on purpose: when deploy-pages runs in the same job right after the upload,
  # it often doesn't see the artifact yet ("No artifacts named github-pages were found",
  # https://github.com/actions/deploy-pages/issues/451).
  pages-build:
    name: Collect site for GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm ci

      - name: Generate templates
        run: |
          /bin/bash transpile.sh
          ls -la templates

      - name: Copy root directory without dependencies
        run: |
          mkdir -p "${RUNNER_TEMP}/site"
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'target/' \
            --exclude 'bin/' \
            --exclude 'node_modules/' \
            --exclude 'vendor/' \
            --exclude '__links/' \
            ./ "${RUNNER_TEMP}/site/"
          ls -la "${RUNNER_TEMP}/site"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  pages-deploy:
    name: Deploy to GitHub Pages
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # only one deployment at a time, don't cancel the one in progress
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
